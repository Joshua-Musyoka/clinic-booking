name: Deploy Clinic Booking API

on:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Configure SSH authentication
              env:
                  DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
              run: |
                  mkdir -p ~/.ssh
                  chmod 700 ~/.ssh

                  printf '%s\n' "$DO_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519

            - name: Configure SSH host verification
              env:
                  DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
              run: |
                  printf '%s\n' "$DO_KNOWN_HOSTS" > ~/.ssh/known_hosts
                  chmod 600 ~/.ssh/known_hosts

            - name: Deploy to DigitalOcean
              env:
                  DO_HOST: ${{ secrets.DO_HOST }}
                  DO_USER: ${{ secrets.DO_USER }}
                  DO_PATH: ${{ secrets.DO_PATH }}
              run: |
                  set -e

                  rsync -az \
                    --exclude='.git/' \
                    --exclude='.venv/' \
                    --exclude='.env' \
                    --exclude='.env.*' \
                    --exclude='__pycache__/' \
                    --exclude='.pytest_cache/' \
                    ./ "$DO_USER@$DO_HOST:$DO_PATH/"

                  ssh "$DO_USER@$DO_HOST" \
                    "cd '$DO_PATH' &&
                     .venv/bin/pip install -r requirements.txt &&
                     sudo -n systemctl restart clinic-booking &&
                     sleep 3 &&
                     curl --fail http://127.0.0.1:8001/health"
