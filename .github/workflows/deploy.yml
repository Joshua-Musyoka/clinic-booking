name: Deploy Clinic Booking API

on:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Deploy to DigitalOcean
              env:
                  DO_HOST: ${{ secrets.DO_HOST }}
                  DO_USER: ${{ secrets.DO_USER }}
                  DO_PATH: ${{ secrets.DO_PATH }}
              run: |
                  set -e

                  rsync -az \
                    --exclude='.git/' \
                    --exclude='.venv/' \
                    --exclude='.env' \
                    --exclude='.env.*' \
                    --exclude='__pycache__/' \
                    --exclude='.pytest_cache/' \
                    ./ "$DO_USER@$DO_HOST:$DO_PATH/"

                  ssh "$DO_USER@$DO_HOST" \
                    "cd '$DO_PATH' &&
                     .venv/bin/pip install -r requirements.txt &&
                     sudo -n systemctl restart clinic-booking &&
                     sleep 3 &&
                     curl --fail http://127.0.0.1:8001/health"
